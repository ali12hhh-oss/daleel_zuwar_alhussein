name: بناء تطبيق دليل زوار الحسين (APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout الكود
        uses: actions/checkout@v5

      - name: تثبيت Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: إنشاء android/local.properties
        run: |
          FLUTTER_SDK_PATH="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK_PATH" > android/local.properties
          cat android/local.properties

      - name: تحميل حزم Flutter
        run: |
          flutter pub upgrade
          flutter pub get

      - name: إصلاح ملف build.gradle لـ geolocator_android
        run: |
          GEO_FILE=$(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/geolocator_android-*/android/build.gradle" | head -1)
          if [ -n "$GEO_FILE" ]; then
            cat > "$GEO_FILE" << 'EOF'
          group 'com.baseflow.geolocator'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace 'com.baseflow.geolocator'
              compileSdk 34

              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              lintOptions {
                  disable 'InvalidPackage'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.10.1'
              implementation 'com.google.android.gms:play-services-location:21.0.1'
          }
          EOF
          fi

      - name: توليد ملفات Gradle Wrapper
        run: |
          set -e
          flutter create --platforms=android --org com.wraptemp /tmp/wrapper_ref
          cp /tmp/wrapper_ref/android/gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp /tmp/wrapper_ref/android/gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp /tmp/wrapper_ref/android/gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          rm -rf /tmp/wrapper_ref

      - name: تحليل الكود
        run: flutter analyze || true

      - name: فحص وجود ملفات الصوت قبل البناء
        run: |
          echo "=== محتويات مجلد res/raw ==="
          ls -la android/app/src/main/res/raw/ || echo "❌ المجلد غير موجود إطلاقاً"
          echo "=== نوع وحجم كل ملف ==="
          file android/app/src/main/res/raw/*.mp3 || true
          echo "=== محتوى .gitattributes إن وُجد (للتأكد من عدم وجود LFS) ==="
          cat .gitattributes 2>/dev/null || echo "لا يوجد ملف .gitattributes"

      - name: بناء APK (Release)
        run: flutter build apk --release

      - name: فحص مجلدات الموارد الوسيطة بعد البناء
        run: |
          echo "=== البحث عن adhan في كل مخرجات البناء ==="
          find android/app/build -iname "*adhan*" 2>/dev/null || echo "لا يوجد أي أثر لملفات adhan في مجلد البناء إطلاقاً"
          echo "=== فحص مجلد merged_res إن وُجد ==="
          find android/app/build -path "*merged_res*" -iname "*.mp3" 2>/dev/null || echo "لا يوجد ملفات mp3 في merged_res"
          echo "=== فحص res الأصلي كما يراه Gradle ==="
          find android/app/build -type d -name "raw" 2>/dev/null

      - name: فحص وجود ملفات الصوت داخل الـ APK بعد البناء
        run: |
          echo "=== محتويات res/raw داخل الـ APK النهائي ==="
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "raw/adhan" || echo "❌ الملفات غير موجودة داخل الـ APK إطلاقاً"

      - name: رفع ملف APK كمخرَج
        uses: actions/upload-artifact@v6
        with:
          name: daleel-zuwar-alhussein-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: إنشاء إصدار على GitHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة تجريبية #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
