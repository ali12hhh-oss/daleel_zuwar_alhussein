name: daleel_zuwar_alhussein
description: "دليل الزائر - تطبيق ديني شامل"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  file_picker: 11.0.3
  google_fonts: ^6.2.1
  sqflite: ^2.3.0
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  flutter_map_cache: ^1.0.0
  http: ^1.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  permission_handler: ^11.3.1
  vibration: ^3.1.4
  flutter_compass: ^0.8.1
  sensors_plus: ^4.0.2
  geomag: ^0.3.0
  share_plus: ^7.2.0
  html_unescape: ^2.0.0
  xml: ^6.5.0
  shared_preferences: ^2.2.2
  quran: ^1.4.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  geolocator_android: ^4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/books/ahilla.pdf
    - assets/books/mafatih_aljanan.json
    - assets/books/sahifa_sajjadiya.json
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B4D3C"
